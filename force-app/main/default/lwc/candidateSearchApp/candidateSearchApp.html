<template>
    <div class="app">
        <header class={heroCls}>
            <div class="hero-top">
                <c-cs-brand logo-url={logoUrl} tone="light"></c-cs-brand>
                <div class="hero-title">
                    <h1 class="h1">{headingText}</h1>
                    <p class="hero-sub">{L.heroSub}</p>
                </div>
                <div class="lang" onkeydown={langKeydown} onfocusout={langFocusOut}>
                    <button
                        class="lang-btn"
                        data-action="language"
                        onclick={toggleLangMenu}
                        aria-haspopup="listbox"
                        aria-expanded={langMenuOpen}
                        aria-label={L.chooseLanguage}
                        title={L.language}
                    >
                        <span>{langLabel}</span><c-cs-icon name="chevron-down" size="14"></c-cs-icon>
                    </button>
                    <template lwc:if={langMenuOpen}>
                        <ul class="lang-menu" role="listbox" aria-label={L.language}>
                            <template for:each={langOptions} for:item="o">
                                <li key={o.value} role="option" aria-selected={o.current}>
                                    <button class={o.cls} data-value={o.value} lang={o.value} onclick={chooseLang}>{o.label}</button>
                                </li>
                            </template>
                        </ul>
                    </template>
                </div>
                <button class="btn btn-parse" data-action="parse" onclick={openParser} title={L.parseCvTitle}>
                    <c-cs-icon name="file-plus" size="15"></c-cs-icon>{L.parseCv}
                </button>
            </div>
            <div class="search-card">
                <c-cs-search-bar
                    lang={lang}
                    criteria={criteria}
                    initial-text={initialText}
                    loading={loading}
                    has-results={hasResults}
                    active={started}
                    onsearch={handleSearch}
                    oncriteriachange={handleCriteriaChange}
                    onsave={handleSave}
                    onclear={handleClear}
                ></c-cs-search-bar>
            </div>
        </header>

        <template lwc:if={showHome}>
            <div class="home-wrap">
                <c-cs-home-panels
                    lang={lang}
                    data={homeData}
                    loading={homeLoading}
                    error={homeError}
                    onrunsearch={handleRunSaved}
                    onfavourite={handleFavourite}
                    onrunexample={handleRunExample}
                ></c-cs-home-panels>
            </div>
        </template>
        <template lwc:else>
            <div class={workspaceCls}>
                <div class="main">
                    <div class="toolbar">
                        <div class="toolbar-title">{resultTitle}</div>
                        <div class="toolbar-actions">
                            <template lwc:if={canUndo}>
                                <button class="btn btn-sm btn-ghost" data-action="undo" onclick={handleUndo} disabled={busy} title={L.undoLastChange}>
                                    <c-cs-icon name="undo" size="14"></c-cs-icon>{L.undo}
                                </button>
                                <button class="btn btn-sm" data-action="reset" onclick={handleReset} disabled={busy} title={L.resetChangesTitle}>
                                    <c-cs-icon name="reset" size="14"></c-cs-icon>{L.resetChanges}
                                </button>
                            </template>
                            <template lwc:if={showChatToggle}>
                                <button
                                    class={refineBtnCls}
                                    data-action="open-chat"
                                    onclick={openChat}
                                    onanimationend={endRefineBounce}
                                    title={L.refineWithAiTitle}
                                >
                                    <c-cs-icon name="sparkles" size="15"></c-cs-icon>{L.refineWithAi}
                                </button>
                            </template>
                        </div>
                    </div>
                    <div class="list-wrap">
                        <c-cs-result-list
                            lang={lang}
                            rows={rows}
                            criteria={criteria}
                            explanations={explanations}
                            selected-ids={selectedIds}
                            active-doc-id={panelDocId}
                            prev-ranks={prevRanks}
                            removed-count={removedCount}
                            total={total}
                            has-more={hasMore}
                            loading={loading}
                            loading-more={loadingMore}
                            hidden-count={hiddenCount}
                            facets={facets}
                            notices={notices}
                            request-xml={requestXml}
                            error={error}
                            onloadmore={handleLoadMore}
                            onrowopen={handleRowOpen}
                            onrowselect={handleRowSelect}
                            onselectpage={handleSelectPage}
                            onexplain={handleExplainRow}
                            onfacetchange={handleFacetChange}
                            onshowhidden={handleShowHidden}
                        ></c-cs-result-list>
                    </div>

                    <template lwc:if={panelRow}>
                        <div class="panel-wrap">
                            <c-cs-candidate-panel
                                lang={lang}
                                row={panelRow}
                                criteria={criteria}
                                explanation={panelExplanation}
                                audit-id={auditId}
                                can-shortlist={canShortlist}
                                position={panelPosition}
                                onclose={closePanel}
                                onnavigate={handlePanelNavigate}
                                onexplain={handleExplainRow}
                                onshortlist={handlePanelShortlist}
                                ondismiss={handlePanelDismiss}
                            ></c-cs-candidate-panel>
                        </div>
                    </template>
                </div>

                <template lwc:if={chatOpen}>
                    <div class="chat-wrap">
                        <c-cs-refine-chat
                            lang={lang}
                            turns={chatTurns}
                            busy={busy}
                            can-undo={canUndo}
                            onrefine={handleRefine}
                            onundo={handleUndo}
                            onclose={closeChat}
                        ></c-cs-refine-chat>
                    </div>
                </template>
            </div>
        </template>

        <template lwc:if={hasSelection}>
            <div class="tray-wrap">
                <c-cs-selection-tray
                    lang={lang}
                    selected={selectedList}
                    job-id={jobId}
                    busy={bulkBusy}
                    oncompare={handleCompare}
                    onaddtojob={handleAddToJob}
                    onaddtopool={handleAddToPool}
                    onemail={openEmail}
                    ontask={openTask}
                    ondeselect={handleTrayDeselect}
                    onclear={clearSelection}
                ></c-cs-selection-tray>
            </div>
        </template>

        <template lwc:if={compareOpen}>
            <div class="backdrop" onclick={closeCompare}>
                <div class="modal" onclick={stopBackdrop}>
                    <c-cs-compare
                        lang={lang}
                        data={compareData}
                        loading={compareLoading}
                        error={compareError}
                        onclose={closeCompare}
                        onremove={handleCompareRemove}
                    ></c-cs-compare>
                </div>
            </div>
        </template>

        <template lwc:if={parserOpen}>
            <div class="backdrop">
                <section class="parser-modal" role="dialog" aria-modal="true" aria-label={L.parseNewCandidate} onkeydown={parserKeydown}>
                    <header class="parser-head">
                        <h2>{L.parseNewCandidate}</h2>
                        <button class="btn-icon parser-close" onclick={closeParser} aria-label={L.close} title={L.close}>
                            <c-cs-icon name="x" size="18"></c-cs-icon>
                        </button>
                    </header>
                    <div class="parser-body">
                        <c-tx-resume-parser></c-tx-resume-parser>
                    </div>
                </section>
            </div>
        </template>

        <template lwc:if={flowOpen}>
            <div class="backdrop">
                <section class="parser-modal" role="dialog" aria-modal="true" aria-label={flowTitle} onkeydown={flowKeydown}>
                    <header class="parser-head">
                        <h2>{flowTitle}</h2>
                        <button class="btn-icon flow-close" onclick={closeFlow} aria-label={L.close} title={L.close}>
                            <c-cs-icon name="x" size="18"></c-cs-icon>
                        </button>
                    </header>
                    <div class="parser-body">
                        <lightning-flow flow-api-name={flowApiName} flow-input-variables={flowInputs} onstatuschange={handleFlowStatus}></lightning-flow>
                    </div>
                </section>
            </div>
        </template>

        <template lwc:if={hasToasts}>
            <div class="toasts" role="status" aria-live="polite">
                <template for:each={toasts} for:item="t">
                    <div key={t.id} class={t.cls}>
                        <span class="toast-icon"><c-cs-icon name={t.icon} size="15" stroke-width="2.5"></c-cs-icon></span>
                        <div class="toast-text">
                            <div class="toast-title">{t.title}</div>
                            <div class="toast-msg">{t.message}</div>
                        </div>
                        <button class="btn-icon sm toast-x" data-id={t.id} onclick={dismissToast} aria-label={L.dismiss}>
                            <c-cs-icon name="x" size="13"></c-cs-icon>
                        </button>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>
