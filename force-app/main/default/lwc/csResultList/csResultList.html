<template>
    <div class="list">
        <div class="head">
            <label class="head-sel" title="Select all loaded candidates">
                <input type="checkbox" checked={pageSelected} onchange={handleSelectPage} aria-label="Select all loaded candidates" />
            </label>
            <div class="count" aria-live="polite">{countText}</div>
            <template lwc:if={hiddenCount}>
                <button class="link" onclick={handleShowHidden}>{hiddenText}</button>
            </template>
            <span class="head-spacer"></span>
            <template lwc:if={hasFacets}>
                <button class="head-btn" onclick={toggleFacets} aria-expanded={facetsOpen}>
                    <lightning-icon icon-name="utility:filterList" size="xx-small" alternative-text=""></lightning-icon>
                    <span>{facetToggleLabel}</span>
                </button>
            </template>
        </div>

        <template lwc:if={facetsOpen}>
            <div class="facets">
                <template for:each={facetGroups} for:item="g">
                    <div key={g.field} class="facet" role="group" aria-label={g.label}>
                        <div class="facet-label">{g.label}</div>
                        <div class="facet-values">
                            <template for:each={g.values} for:item="v">
                                <button key={v.key} class={v.cls} data-field={g.field} data-value={v.value} aria-pressed={v.pressed} onclick={toggleFacetValue}>
                                    {v.text}
                                </button>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <template lwc:if={hasNotices}>
            <div class="notices">
                <template for:each={noticeItems} for:item="n">
                    <div key={n.id} class="notice">{n.text}</div>
                </template>
            </div>
        </template>

        <template lwc:if={error}>
            <div class="error" role="alert">{error}</div>
        </template>

        <template lwc:if={removedCount}>
            <div class="removed">{removedText}</div>
        </template>

        <template lwc:if={loading}>
            <div class="loading-rows" aria-label="Searching">
                <div class="ghost"></div>
                <div class="ghost"></div>
                <div class="ghost"></div>
                <div class="ghost"></div>
            </div>
        </template>
        <template lwc:else>
            <div class="rows" role="list">
                <template for:each={items} for:item="it">
                    <c-cs-result-row
                        key={it.key}
                        role="listitem"
                        data-doc-id={it.docId}
                        item={it}
                        onrowopen={handleRowOpen}
                        onrowselect={handleRowSelect}
                        onexplain={handleExplain}
                    ></c-cs-result-row>
                </template>
            </div>

            <template lwc:if={showEmpty}>
                <div class="empty">
                    <p class="empty-title">No candidates match all of these criteria.</p>
                    <p>Try a larger radius, change a "Must have" to "Nice to have", or ask the assistant to loosen the search.</p>
                </div>
            </template>

            <template lwc:if={hasMore}>
                <div class="sentinel">
                    <template lwc:if={loadingMore}>
                        <lightning-spinner size="small" alternative-text="Loading more candidates" variant="brand"></lightning-spinner>
                    </template>
                    <template lwc:else>
                        <button class="link" onclick={loadMoreClick}>Load more</button>
                    </template>
                </div>
            </template>
            <template lwc:if={showEnd}>
                <div class="end">End of results</div>
            </template>
        </template>

        <template lwc:if={hasRequest}>
            <div class="req-viewer">
                <button class="req-toggle" onclick={toggleRequest} aria-expanded={requestOpen}>
                    <lightning-icon icon-name={requestIcon} size="xx-small" alternative-text=""></lightning-icon>
                    <span class="req-toggle-label">Search sent to Textkernel</span>
                </button>
                <template lwc:if={requestOpen}>
                    <div class="req-panel">
                        <div class="req-bar">
                            <span class="req-note">Masked: the password is never shown.</span>
                            <lightning-button-icon
                                icon-name="utility:copy"
                                size="small"
                                variant="bare"
                                alternative-text="Copy request"
                                onclick={copyRequest}
                            ></lightning-button-icon>
                        </div>
                        <div class="req-code">
                            <template for:each={requestLines} for:item="l">
                                <div key={l.id} class={l.cls}>{l.text}</div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>
