<template>
    <div class="list">
        <div class="head">
            <label class="head-sel" title="Select all loaded candidates">
                <input class="checkbox" type="checkbox" checked={pageSelected} onchange={handleSelectPage} aria-label="Select all loaded candidates" />
            </label>
            <div class="count" aria-live="polite">{countText}</div>
            <template lwc:if={hiddenCount}>
                <button class="link head-link" onclick={handleShowHidden}><c-cs-icon name="eye-off" size="13"></c-cs-icon>{hiddenText}</button>
            </template>
            <span class="head-spacer"></span>
            <div class="columns-wrap">
                <button class="btn btn-sm columns-toggle" data-action="columns" onclick={toggleColumns} aria-expanded={columnsOpen} aria-haspopup="dialog">
                    <c-cs-icon name="columns" size="14"></c-cs-icon>
                    <span>{columnsLabel}</span>
                </button>
                <template lwc:if={columnsOpen}>
                    <div class="columns-pop" role="dialog" aria-label="Choose columns" onkeydown={handleColumnsKeydown}>
                        <div class="columns-head">
                            <span class="columns-title">Columns</span>
                            <button class="link" onclick={resetColumns}>Reset</button>
                            <button class="btn-icon sm" onclick={closeColumns} aria-label="Close"><c-cs-icon name="x" size="14"></c-cs-icon></button>
                        </div>
                        <template for:each={columnGroups} for:item="g">
                            <fieldset key={g.id} class="columns-group">
                                <legend class="eyebrow">{g.label}</legend>
                                <template for:each={g.options} for:item="o">
                                    <label key={o.key} class="columns-opt">
                                        <input
                                            class="checkbox"
                                            type="checkbox"
                                            data-key={o.key}
                                            checked={o.checked}
                                            disabled={o.disabled}
                                            onchange={toggleColumn}
                                        />
                                        <span>{o.label}</span>
                                    </label>
                                </template>
                            </fieldset>
                        </template>
                        <template lwc:if={sfError}><p class="columns-error" role="alert">{sfError}</p></template>
                        <p class="columns-hint">{columnsHint}</p>
                    </div>
                </template>
            </div>
            <template lwc:if={hasFacets}>
                <button class="btn btn-sm facet-toggle" onclick={toggleFacets} aria-expanded={facetsOpen}>
                    <c-cs-icon name="sliders" size="14"></c-cs-icon>
                    <span>{facetToggleLabel}</span>
                </button>
            </template>
        </div>

        <template lwc:if={facetsOpen}>
            <div class="facets">
                <template for:each={facetGroups} for:item="g">
                    <div key={g.field} class="facet" role="group" aria-label={g.label}>
                        <div class="eyebrow">{g.label}</div>
                        <div class="facet-values">
                            <template for:each={g.values} for:item="v">
                                <button key={v.key} class={v.cls} data-field={g.field} data-value={v.value} aria-pressed={v.pressed} onclick={toggleFacetValue}>
                                    {v.text}
                                </button>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <template lwc:if={hasNotices}>
            <div class="notices">
                <template for:each={noticeItems} for:item="n">
                    <div key={n.id} class="notice"><c-cs-icon name="alert" size="14"></c-cs-icon><span>{n.text}</span></div>
                </template>
            </div>
        </template>

        <template lwc:if={error}>
            <div class="error" role="alert"><c-cs-icon name="alert" size="16"></c-cs-icon><span>{error}</span></div>
        </template>

        <template lwc:if={removedCount}>
            <div class="removed">{removedText}</div>
        </template>

        <template lwc:if={loading}>
            <div class="loading-rows" aria-label="Searching">
                <div class="ghost"><span class="g-av"></span><span class="g-l"></span><span class="g-m"></span><span class="g-r"></span></div>
                <div class="ghost"><span class="g-av"></span><span class="g-l"></span><span class="g-m"></span><span class="g-r"></span></div>
                <div class="ghost"><span class="g-av"></span><span class="g-l"></span><span class="g-m"></span><span class="g-r"></span></div>
                <div class="ghost"><span class="g-av"></span><span class="g-l"></span><span class="g-m"></span><span class="g-r"></span></div>
                <div class="ghost"><span class="g-av"></span><span class="g-l"></span><span class="g-m"></span><span class="g-r"></span></div>
            </div>
        </template>
        <template lwc:else>
            <template lwc:if={showColumnHeader}>
                <div class="col-head" style={gridStyle}>
                    <span></span>
                    <span class="col-label">Candidate</span>
                    <span class="col-label">Criteria</span>
                    <template for:each={headerCols} for:item="c">
                        <span key={c.key} class="col-label col-chosen">
                            <span class="col-text" title={c.label}>{c.label}</span>
                            <span
                                class="col-resize"
                                data-key={c.key}
                                role="separator"
                                aria-orientation="vertical"
                                aria-label={c.resizeLabel}
                                title="Drag to resize. Double-click for the default width."
                                tabindex="0"
                                onpointerdown={startResize}
                                onpointermove={moveResize}
                                onpointerup={endResize}
                                onpointercancel={endResize}
                                ondblclick={resetWidth}
                                onkeydown={resizeKeydown}
                            ></span>
                        </span>
                    </template>
                    <span class="col-label">Summary</span>
                    <span class="col-label col-score">Match</span>
                </div>
            </template>
            <div class="rows" role="list" style={gridStyle}>
                <template for:each={items} for:item="it">
                    <c-cs-result-row
                        key={it.key}
                        role="listitem"
                        data-doc-id={it.docId}
                        item={it}
                        onrowopen={handleRowOpen}
                        onrowselect={handleRowSelect}
                        onexplain={handleExplain}
                    ></c-cs-result-row>
                </template>
            </div>

            <template lwc:if={showEmpty}>
                <div class="empty">
                    <div class="empty-icon"><c-cs-icon name="search" size="26"></c-cs-icon></div>
                    <p class="empty-title">No matches</p>
                    <p>Widen the radius or relax a must-have.</p>
                </div>
            </template>

            <template lwc:if={hasMore}>
                <div class="sentinel">
                    <template lwc:if={loadingMore}>
                        <span class="spinner" role="status" aria-label="Loading more candidates"></span>
                    </template>
                    <template lwc:else>
                        <button class="btn btn-sm" onclick={loadMoreClick}>Load more</button>
                    </template>
                </div>
            </template>
            <template lwc:if={showEnd}>
                <div class="end"><span>End of results</span></div>
            </template>
        </template>

        <template lwc:if={hasRequest}>
            <div class="req-viewer">
                <button class="req-toggle" onclick={toggleRequest} aria-expanded={requestOpen}>
                    <c-cs-icon name={requestIcon} size="14"></c-cs-icon>
                    <c-cs-icon name="code" size="14"></c-cs-icon>
                    <span class="req-toggle-label">Search sent to Textkernel</span>
                </button>
                <template lwc:if={requestOpen}>
                    <div class="req-panel">
                        <div class="req-bar">
                            <span class="req-note">Password masked</span>
                            <button class="btn-icon sm req-copy" onclick={copyRequest} aria-label="Copy request" title="Copy request">
                                <c-cs-icon name="copy" size="14"></c-cs-icon>
                            </button>
                        </div>
                        <div class="req-code">
                            <template for:each={requestLines} for:item="l">
                                <div key={l.id} class={l.cls}>{l.text}</div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>
