<template>
    <section class="panel" role="dialog" aria-label={dialogLabel} onkeydown={handleKeydown}>
        <header class="p-head">
            <div class="p-top">
                <div class="p-nav">
                    <button class="btn-icon sm" onclick={handlePrev} aria-label={L.prevCandidate} title={L.prevCandidateKey}>
                        <c-cs-icon name="chevron-up" size="16"></c-cs-icon>
                    </button>
                    <button class="btn-icon sm" onclick={handleNext} aria-label={L.nextCandidate} title={L.nextCandidateKey}>
                        <c-cs-icon name="chevron-down" size="16"></c-cs-icon>
                    </button>
                    <template lwc:if={position}><span class="p-pos">{position}</span></template>
                </div>
                <button class="btn-icon sm close-btn" onclick={handleClose} aria-label={L.close} title={L.closeEscape}>
                    <c-cs-icon name="x" size="16"></c-cs-icon>
                </button>
            </div>

            <div class="p-id">
                <span class={avatarCls} aria-hidden="true">{initials}</span>
                <div class="p-title">
                    <h2 class="p-name">{name}</h2>
                    <div class="p-sub">{subtitle}</div>
                    <template lwc:if={pipelineLabel}><span class="tag tag-amber p-tag">{pipelineLabel}</span></template>
                </div>
                <div class="p-score" title={L.tkScoreTitle}>
                    <div class={score.cls} style={score.style}><span class="ring-num">{score.text}</span></div>
                    <span class="p-score-label">{L.matchWord}</span>
                </div>
            </div>

            <div class="p-actions">
                <button class="btn btn-sm" data-action="open-record" onclick={openRecord} disabled={noRecord}>
                    <c-cs-icon name="external" size="14"></c-cs-icon>{L.openRecord}
                </button>
                <template lwc:if={canShortlist}>
                    <button class="btn btn-sm btn-soft" data-action="shortlist" onclick={handleShortlist} disabled={shortlistDisabled}>
                        <c-cs-icon name="plus" size="14"></c-cs-icon>{L.shortlistOnJobBtn}
                    </button>
                </template>
                <button class="btn btn-sm btn-ghost" data-action="dismiss" onclick={handleDismiss}>
                    <c-cs-icon name="eye-off" size="14"></c-cs-icon>{L.dismiss}
                </button>
                <button class="btn btn-sm btn-soft" data-action="match-jobs" onclick={matchToJobs} disabled={noRecord} title={L.findJobsTitle}>
                    <c-cs-icon name="briefcase" size="14"></c-cs-icon>{L.matchToJobs}
                </button>
            </div>

            <div class="seg tabs" role="tablist" aria-label={L.candidateDetails} onkeydown={handleTabKeydown}>
                <template for:each={tabs} for:item="t">
                    <button
                        key={t.value}
                        id={t.id}
                        class={t.cls}
                        role="tab"
                        aria-selected={t.selected}
                        tabindex={t.tabIndex}
                        data-tab={t.value}
                        onclick={selectTab}
                    >
                        {t.label}
                    </button>
                </template>
            </div>
        </header>

        <div class="p-body" role="tabpanel">
            <template lwc:if={isWhy}>
                <div class="ai-card">
                    <div class="ai-head">{L.whyTheyMatch}</div>
                    <template lwc:if={explainPending}>
                        <div class="shimmer" aria-label={L.explanationLoading}><span></span><span></span><span></span></div>
                    </template>
                    <template lwc:if={summary}>
                        <p class="p-summary">{summary}</p>
                    </template>
                    <template lwc:if={explainMissing}>
                        <div class="p-explain">
                            <span>{L.notExplainedYet}</span>
                            <button class="btn btn-sm btn-ai" data-action="explain" onclick={handleExplain}>{L.explain}</button>
                        </div>
                        <template lwc:if={explainErrorText}><div class="p-muted">{explainErrorText}</div></template>
                    </template>
                </div>

                <h3 class="eyebrow p-section">{L.criteriaScoredByTk}</h3>
                <ul class="why-list">
                    <template for:each={whyCriteria} for:item="c">
                        <li key={c.id} class={c.cls}>
                            <span class="why-icon"><c-cs-icon name={c.icon} size="12" stroke-width="3"></c-cs-icon></span>
                            <div class="why-text">
                                <div class="why-label">
                                    <span>{c.label}</span>
                                    <span class="why-status">{c.status}</span>
                                </div>
                                <div class="why-meta">{c.meta}</div>
                                <template lwc:if={c.hasEvidence}>
                                    <blockquote class="why-evidence">
                                        {c.evidence}
                                        <template lwc:if={c.source}><cite class="why-source">{c.source}</cite></template>
                                    </blockquote>
                                </template>
                            </div>
                        </li>
                    </template>
                </ul>

                <template lwc:if={hasHighlights}>
                    <h3 class="eyebrow p-section">{L.matchedText}</h3>
                    <ul class="hl-list">
                        <template for:each={highlights} for:item="h">
                            <li key={h.id} class="hl">
                                <span class="hl-field">{h.field}</span>
                                <span class="hl-text"
                                    ><template for:each={h.segments} for:item="g"><span key={g.key} class={g.cls}>{g.text}</span></template></span
                                >
                            </li>
                        </template>
                    </ul>
                </template>
            </template>

            <template lwc:if={isCv}>
                <c-cs-cv-viewer doc-id={docId} contact-id={contactId} terms={cvTerms} lang={lang}></c-cs-cv-viewer>
            </template>

            <template lwc:if={isJobs}>
                <c-cs-job-matches doc-id={docId} contact-id={contactId} lang={lang}></c-cs-job-matches>
            </template>

            <template lwc:if={isProfile}>
                <template lwc:if={hasTkProfile}>
                    <h3 class="eyebrow p-section tk-head">{L.fromTkProfile}</h3>
                    <dl class="tk-profile">
                        <template for:each={tkProfile} for:item="r">
                            <div key={r.key} class="tk-row">
                                <dt>{r.label}</dt>
                                <dd>
                                    <span class={r.listCls}>
                                        <template for:each={r.values} for:item="v">
                                            <span key={v.key} class={v.cls}
                                                ><template for:each={v.segs} for:item="g"><span key={g.key} class={g.cls}>{g.text}</span></template></span
                                            >
                                        </template>
                                    </span>
                                    <template lwc:if={r.moreText}
                                        ><button class="link tk-more" data-label={r.label} onclick={toggleMore}>{r.moreText}</button></template
                                    >
                                </dd>
                            </div>
                        </template>
                    </dl>
                    <h3 class="eyebrow p-section">{L.fromSalesforce}</h3>
                </template>
                <template lwc:if={noRecord}><p class="p-muted">{L.noSfRecordDot}</p></template>
                <template lwc:if={detailLoading}
                    ><div class="p-loading"><span class="spinner" role="status" aria-label={L.loadingProfile}></span></div
                ></template>
                <template lwc:if={detailError}><div class="p-error" role="alert">{detailError}</div></template>
                <dl class="facts">
                    <template for:each={profileRows} for:item="f">
                        <div key={f.key} class="fact">
                            <dt>{f.label}</dt>
                            <dd>{f.value}</dd>
                        </div>
                    </template>
                </dl>
            </template>

            <template lwc:if={isSkills}>
                <template lwc:if={detailLoading}
                    ><div class="p-loading"><span class="spinner" role="status" aria-label={L.loadingSkills}></span></div
                ></template>
                <template lwc:if={detailError}><div class="p-error" role="alert">{detailError}</div></template>
                <template lwc:if={hasSkills}>
                    <div class="skills">
                        <template for:each={skills} for:item="s">
                            <span key={s.id} class="skill">{s.label}</span>
                        </template>
                    </div>
                </template>
                <template lwc:elseif={showDetailEmpty}><p class="p-muted">{L.noSkills}</p></template>
            </template>

            <template lwc:if={isActivity}>
                <template lwc:if={detailLoading}
                    ><div class="p-loading"><span class="spinner" role="status" aria-label={L.loadingActivity}></span></div
                ></template>
                <template lwc:if={detailError}><div class="p-error" role="alert">{detailError}</div></template>
                <template lwc:if={hasNotes}>
                    <ol class="timeline">
                        <template for:each={notes} for:item="n">
                            <li key={n.id} class="note">
                                <span class="note-dot" aria-hidden="true"></span>
                                <div class="note-head">{n.head}</div>
                                <div class="note-text">{n.text}</div>
                            </li>
                        </template>
                    </ol>
                </template>
                <template lwc:elseif={showDetailEmpty}><p class="p-muted">{L.noRecentNotes}</p></template>
            </template>
        </div>
    </section>
</template>
