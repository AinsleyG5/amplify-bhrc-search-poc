<template>
    <div class={rowCls} data-doc-id={item.docId} onclick={handleRowClick}>
        <div class="sel" onclick={stop}>
            <input
                class="checkbox"
                type="checkbox"
                checked={item.selected}
                disabled={checkboxDisabled}
                onchange={handleSelect}
                aria-label={selectLabel}
                title={checkboxTitle}
            />
        </div>

        <div class="who">
            <span class={item.avatarCls} aria-hidden="true">{item.initials}</span>
            <div class="who-text">
                <div class="name-line">
                    <button class="name-btn" onclick={handleOpen} aria-label={openLabel}>{item.name}</button>
                    <span class="rank">#{item.rank}</span>
                </div>
                <div class="sub">
                    <span class="sub-title">{item.title}</span>
                    <template lwc:if={item.city}
                        ><span class="sub-city"><c-cs-icon name="pin" size="12"></c-cs-icon>{item.city}</span></template
                    >
                </div>
                <div class="tags">
                    <template lwc:if={item.changeTag}
                        ><span class={item.changeTag.cls}
                            ><c-cs-icon name={item.changeTag.icon} size="11" stroke-width="2.5"></c-cs-icon>{item.changeTag.label}</span
                        ></template
                    >
                    <template lwc:if={item.pipelineLabel}><span class="tag tag-amber">{item.pipelineLabel}</span></template>
                    <template lwc:if={item.placedRecently}><span class="tag tag-violet">{L.placedRecently}</span></template>
                </div>
            </div>
        </div>

        <div class="crit" aria-label={L.criteriaMet}>
            <template for:each={visibleCriteria} for:item="c">
                <span key={c.id} class={c.cls} title={c.title}>
                    <c-cs-icon name={c.icon} size="11" stroke-width="3"></c-cs-icon>
                    <span class="crit-label">{c.label}</span>
                    <span class="sr-only">{c.statusText}</span>
                </span>
            </template>
            <template lwc:if={critCollapsible}>
                <button class="crit-more" data-action="toggle-criteria" onclick={toggleCriteria} aria-expanded={critOpen} title={critMoreTitle}>
                    {critMoreText}
                </button>
            </template>
        </div>

        <template lwc:if={item.facts}>
            <div class={item.factsCls}>
                <template for:each={item.facts} for:item="f">
                    <div key={f.key} class="fact" title={f.title}>
                        <div class="fact-label">{f.label}</div>
                        <div class={f.cls}>{f.text}</div>
                    </div>
                </template>
            </div>
        </template>

        <div class="why">
            <template lwc:if={explainPending}>
                <div class="shimmer" aria-label={L.explanationLoading}><span></span><span></span></div>
            </template>
            <template lwc:if={explainDone}>
                <p class="summary" title={summary}>{summary}</p>
            </template>
            <template lwc:if={explainError}>
                <p class="why-muted" title={errorText}>{L.couldntExplain} <button class="link" onclick={handleExplain}>{L.retry}</button></p>
            </template>
            <template lwc:if={explainAvailable}>
                <button class="explain-btn" onclick={handleExplain}>{L.explain}</button>
            </template>
        </div>

        <div
            class="score"
            tabindex="0"
            role="button"
            aria-label={scoreLabel}
            aria-describedby="match-pop"
            onmouseenter={showMatch}
            onmouseleave={hideMatch}
            onfocus={showMatch}
            onblur={hideMatch}
            onkeydown={scoreKeydown}
        >
            <div class={item.ringCls} style={item.ringStyle}>
                <span class="ring-num">{item.ringText}</span>
            </div>
            <div id="match-pop" class={matchPopCls} role="tooltip">
                <div class="mp-head">
                    <span class="mp-score">{item.ringText}</span>
                    <span class="mp-sub">{matchSub}</span>
                </div>
                <template lwc:if={item.match.hasMet}>
                    <div class="mp-group">
                        <div class="mp-label mp-label-met">{L.matches}</div>
                        <ul class="mp-list">
                            <template for:each={item.match.met} for:item="m">
                                <li key={m.id} class="mp-item mp-met">
                                    <c-cs-icon name="check" size="12" stroke-width="3"></c-cs-icon>
                                    <span class="mp-text">{m.label}</span>
                                    <span class="mp-weight">{m.weight}</span>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
                <template lwc:if={item.match.hasNotMet}>
                    <div class="mp-group">
                        <div class="mp-label mp-label-not">{L.doesntMatch}</div>
                        <ul class="mp-list">
                            <template for:each={item.match.notMet} for:item="m">
                                <li key={m.id} class="mp-item mp-not">
                                    <c-cs-icon name="x" size="12" stroke-width="3"></c-cs-icon>
                                    <span class="mp-text">{m.label}</span>
                                    <span class="mp-weight">{m.weight}</span>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
                <template lwc:if={item.match.hasNa}>
                    <div class="mp-group">
                        <div class="mp-label">{L.notScoredSeparately}</div>
                        <ul class="mp-list">
                            <template for:each={item.match.na} for:item="m">
                                <li key={m.id} class="mp-item mp-na">
                                    <c-cs-icon name="minus" size="12" stroke-width="3"></c-cs-icon>
                                    <span class="mp-text">{m.label}</span>
                                    <span class="mp-weight">{m.weight}</span>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
