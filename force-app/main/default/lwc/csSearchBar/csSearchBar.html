<template>
    <div class="bar">
        <div class="nl-row">
            <div class="nl-input">
                <lightning-icon icon-name="utility:search" size="x-small" class="nl-icon" alternative-text=""></lightning-icon>
                <textarea
                    class="nl-text"
                    rows="1"
                    placeholder="Describe who you need, for example: forklift-certified warehouse operatives within 15 miles of Dagenham"
                    aria-label="Describe the candidates you are looking for"
                    oninput={handleText}
                    onkeydown={handleKeydown}
                ></textarea>
            </div>
            <lightning-button variant="brand" label="Search" onclick={submit} disabled={searchDisabled} class="nl-go"></lightning-button>
            <template lwc:if={hasResults}>
                <lightning-button-icon
                    icon-name="utility:save"
                    variant="border-filled"
                    alternative-text="Save this search"
                    title="Save this search"
                    onclick={handleSave}
                ></lightning-button-icon>
                <lightning-button-icon
                    icon-name="utility:home"
                    variant="border-filled"
                    alternative-text="New search"
                    title="New search"
                    onclick={handleClear}
                ></lightning-button-icon>
            </template>
        </div>

        <template lwc:if={hasCriteria}>
            <div class="chips" role="list" aria-label="Search criteria">
                <template for:each={chips} for:item="chip">
                    <span key={chip.id} class={chip.cls} role="listitem">
                        <button class="chip-body" data-id={chip.id} onclick={openChip} title={chip.title} aria-label={chip.title}>
                            <span class="chip-kind">{chip.kind}</span>
                            <span class="chip-label">{chip.label}</span>
                            <span class="chip-weight">{chip.weight}</span>
                        </button>
                        <button class="chip-x" data-id={chip.id} onclick={removeChip} aria-label={chip.removeLabel} title={chip.removeLabel}>
                            <lightning-icon icon-name="utility:close" size="xx-small" alternative-text=""></lightning-icon>
                        </button>
                    </span>
                </template>
                <template for:each={filterChips} for:item="f">
                    <span key={f.key} class="chip chip-filter" role="listitem">
                        <span class="chip-body chip-static"><span class="chip-kind">Filter</span><span class="chip-label">{f.label}</span></span>
                        <button
                            class="chip-x"
                            data-field={f.field}
                            data-value={f.value}
                            onclick={removeFilter}
                            aria-label={f.removeLabel}
                            title={f.removeLabel}
                        >
                            <lightning-icon icon-name="utility:close" size="xx-small" alternative-text=""></lightning-icon>
                        </button>
                    </span>
                </template>
                <template for:each={exclusionChips} for:item="x">
                    <span key={x.key} class="chip chip-exclusion" role="listitem">
                        <span class="chip-body chip-static"><span class="chip-kind">Exclude</span><span class="chip-label">{x.label}</span></span>
                        <button class="chip-x" data-key={x.key} onclick={removeExclusion} aria-label={x.removeLabel} title={x.removeLabel}>
                            <lightning-icon icon-name="utility:close" size="xx-small" alternative-text=""></lightning-icon>
                        </button>
                    </span>
                </template>
                <button class="chip-add" onclick={openAdd} aria-label="Add a criterion">
                    <lightning-icon icon-name="utility:add" size="xx-small" alternative-text=""></lightning-icon>
                    <span>Add</span>
                </button>
            </div>

            <div class="options">
                <label class="opt">
                    <span>Exclude anyone placed in the last</span>
                    <input
                        class="opt-days"
                        type="number"
                        min="1"
                        max="3650"
                        value={placedDays}
                        onchange={handlePlacedDays}
                        aria-label="Exclude anyone placed in the last N days"
                    />
                    <span>days</span>
                </label>
                <template lwc:if={isJobSearch}>
                    <label class="opt">
                        <input type="checkbox" checked={pipelineHidden} onchange={togglePipeline} />
                        <span>Hide candidates already on this job</span>
                    </label>
                </template>
            </div>
        </template>

        <template lwc:if={hasEditor}>
            <div class="editor" onkeydown={handleEditorKeydown} role="group" aria-label={editorTitle}>
                <div class="editor-title">{editorTitle}</div>
                <div class="editor-grid">
                    <template lwc:if={isAdd}>
                        <lightning-combobox
                            label="Type"
                            data-field="kind"
                            value={editor.kind}
                            options={kindOptions}
                            onchange={handleEditor}
                            class="ed-kind"
                        ></lightning-combobox>
                    </template>
                    <template lwc:if={showValue}>
                        <div class="ed-value">
                            <lightning-input
                                label={valueLabel}
                                data-field="value"
                                value={editor.value}
                                onchange={handleEditor}
                                autocomplete="off"
                            ></lightning-input>
                            <template lwc:if={hasSuggestions}>
                                <ul class="suggest" role="listbox" aria-label="Skill suggestions">
                                    <template for:each={suggestions} for:item="s">
                                        <li key={s.id} role="option" aria-selected="false">
                                            <button class="suggest-item" data-id={s.id} data-label={s.label} onclick={pickSuggestion}>
                                                <span>{s.label}</span>
                                                <span class="suggest-cat">{s.category}</span>
                                            </button>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                        </div>
                    </template>
                    <template lwc:if={isLocation}>
                        <lightning-input
                            type="number"
                            label="Radius (miles)"
                            data-field="radius"
                            value={editor.radius}
                            min="0"
                            max="500"
                            onchange={handleEditor}
                            class="ed-radius"
                        ></lightning-input>
                    </template>
                    <template lwc:if={isAvailability}>
                        <lightning-input
                            type="number"
                            label="Available within (days)"
                            data-field="withinDays"
                            value={editor.withinDays}
                            min="1"
                            max="365"
                            onchange={handleEditor}
                            class="ed-radius"
                        ></lightning-input>
                    </template>
                    <lightning-radio-group
                        label="Weight"
                        data-field="weight"
                        options={weightOptions}
                        value={editor.weight}
                        type="button"
                        onchange={handleEditor}
                        class="ed-weight"
                    ></lightning-radio-group>
                </div>
                <template lwc:if={editorError}><div class="ed-error" role="alert">{editorError}</div></template>
                <div class="editor-actions">
                    <lightning-button label="Cancel" onclick={cancelEditor}></lightning-button>
                    <lightning-button variant="brand" label={editorSaveLabel} onclick={saveEditor}></lightning-button>
                </div>
            </div>
        </template>
    </div>
</template>
