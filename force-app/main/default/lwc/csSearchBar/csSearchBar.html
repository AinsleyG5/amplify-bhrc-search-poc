<template>
    <div class="bar">
        <div class="nl-row">
            <div class="nl-wrap">
                <div class="nl-input">
                    <span class="nl-icon"><c-cs-icon name="sparkles" size="18"></c-cs-icon></span>
                    <textarea
                        class="nl-text"
                        rows="1"
                        placeholder="e.g. Forklift-certified warehouse operatives within 15 miles of Dagenham"
                        aria-label="Describe the candidates you are looking for"
                        oninput={handleText}
                        onkeydown={handleKeydown}
                        onblur={handleBlur}
                        role="combobox"
                        aria-autocomplete="list"
                        aria-expanded={taOpen}
                    ></textarea>
                    <template lwc:if={hasText}>
                        <button class="btn-icon sm nl-clear" onclick={clearText} aria-label="Clear the text" title="Clear the text">
                            <c-cs-icon name="x" size="14"></c-cs-icon>
                        </button>
                    </template>
                    <button class="btn btn-search btn-lg nl-go" data-action="search" onclick={submit} disabled={searchDisabled}>
                        <template lwc:if={loading}><span class="spinner sm light"></span></template>
                        <template lwc:else><c-cs-icon name="search" size="16"></c-cs-icon></template>
                        <span>{searchLabel}</span>
                    </button>
                </div>
                <template lwc:if={taOpen}>
                    <ul class="ta" role="listbox" aria-label="Suggestions">
                        <template for:each={taRows} for:item="r">
                            <li
                                key={r.key}
                                class={r.cls}
                                role="option"
                                aria-selected={r.selected}
                                data-index={r.index}
                                onmousedown={keepFocus}
                                onclick={handleRowClick}
                            >
                                <span class="ta-icon"><c-cs-icon name={r.icon} size="14"></c-cs-icon></span>
                                <span class="ta-label">{r.label}</span>
                                <span class="ta-sub">{r.sub}</span>
                            </li>
                        </template>
                        <template lwc:if={taLoading}
                            ><li class="ta-row ta-status" role="presentation">
                                <span class="spinner sm"></span><span class="ta-label">Looking up job titles and skills…</span>
                            </li></template
                        >
                    </ul>
                </template>
            </div>
            <template lwc:if={showClear}>
                <div class="nl-actions">
                    <template lwc:if={hasResults}>
                        <div class="save-wrap">
                            <button class="btn btn-icon-text" data-action="save" onclick={handleSave} aria-expanded={saveOpen} title="Save this search">
                                <c-cs-icon name="bookmark" size="15"></c-cs-icon><span>Save</span>
                            </button>
                            <template lwc:if={saveOpen}>
                                <div class="pop save-pop" role="dialog" aria-label="Save this search">
                                    <label class="field">
                                        <span class="field-label">Name this search</span>
                                        <input
                                            class="input save-input"
                                            type="text"
                                            maxlength="80"
                                            value={saveName}
                                            oninput={handleSaveName}
                                            onkeydown={handleSaveKeydown}
                                        />
                                    </label>
                                    <div class="pop-actions">
                                        <button class="btn btn-ghost btn-sm" onclick={cancelSave}>Cancel</button>
                                        <button class="btn btn-primary btn-sm" data-action="confirm-save" onclick={confirmSave} disabled={saveDisabled}>
                                            Save search
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                    <button
                        class="btn btn-icon-text"
                        data-action="clear"
                        onclick={handleClear}
                        title="Clear the search and go back to your recent and saved searches"
                    >
                        <c-cs-icon name="reset" size="15"></c-cs-icon><span>Clear search</span>
                    </button>
                </div>
            </template>
        </div>

        <template lwc:if={hasCriteria}>
            <div class="chips" role="list" aria-label="Search criteria">
                <template for:each={chips} for:item="chip">
                    <span key={chip.id} class={chip.cls} role="listitem">
                        <button class="chip-body" data-id={chip.id} onclick={openChip} title={chip.title} aria-label={chip.title}>
                            <span class={chip.dotCls}></span>
                            <span class="chip-kind">{chip.kind}</span>
                            <span class="chip-label">{chip.label}</span>
                            <span class="chip-weight">{chip.weight}</span>
                        </button>
                        <button class="chip-x" data-id={chip.id} onclick={removeChip} aria-label={chip.removeLabel} title={chip.removeLabel}>
                            <c-cs-icon name="x" size="12" stroke-width="2.5"></c-cs-icon>
                        </button>
                    </span>
                </template>
                <template for:each={filterChips} for:item="f">
                    <span key={f.key} class="chip chip-filter" role="listitem">
                        <span class="chip-body chip-static"><c-cs-icon name="filter" size="12"></c-cs-icon><span class="chip-label">{f.label}</span></span>
                        <button
                            class="chip-x"
                            data-field={f.field}
                            data-value={f.value}
                            onclick={removeFilter}
                            aria-label={f.removeLabel}
                            title={f.removeLabel}
                        >
                            <c-cs-icon name="x" size="12" stroke-width="2.5"></c-cs-icon>
                        </button>
                    </span>
                </template>
                <template for:each={exclusionChips} for:item="x">
                    <span key={x.key} class="chip chip-exclusion" role="listitem">
                        <span class="chip-body chip-static"><c-cs-icon name="ban" size="12"></c-cs-icon><span class="chip-label">{x.label}</span></span>
                        <button class="chip-x" data-key={x.key} onclick={removeExclusion} aria-label={x.removeLabel} title={x.removeLabel}>
                            <c-cs-icon name="x" size="12" stroke-width="2.5"></c-cs-icon>
                        </button>
                    </span>
                </template>
                <button class="chip-add" onclick={openAdd} aria-label="Add a criterion">
                    <c-cs-icon name="plus" size="13" stroke-width="2.5"></c-cs-icon>
                    <span>Add criterion</span>
                </button>
            </div>

            <template lwc:if={hasStrip}>
                <div class="strip" role="group" aria-label={strip.title}>
                    <div class="strip-head">
                        <span class="strip-title">{strip.title}</span>
                        <button class="link strip-all" onclick={addAllSuggested} disabled={addAllDisabled}>Add all</button>
                        <button class="btn-icon sm strip-x" onclick={closeStrip} aria-label="Hide suggestions" title="Hide suggestions">
                            <c-cs-icon name="x" size="13"></c-cs-icon>
                        </button>
                    </div>
                    <template lwc:if={strip.loading}
                        ><div class="strip-note"><span class="spinner sm"></span>Asking Textkernel…</div></template
                    >
                    <template lwc:if={strip.error}><div class="strip-note strip-error">Suggestions unavailable: {strip.error}</div></template>
                    <template lwc:if={stripEmpty}><div class="strip-note">No suggestions for this one.</div></template>
                    <div class="strip-items">
                        <template for:each={stripItems} for:item="k">
                            <button key={k.id} class={k.cls} data-id={k.id} onclick={addSuggested} title={k.title} disabled={k.added}>
                                <c-cs-icon name={k.icon} size="12" stroke-width="2.5"></c-cs-icon>{k.label}
                            </button>
                        </template>
                    </div>
                </div>
            </template>

            <div class="options">
                <label class="opt">
                    <span>Exclude anyone placed in the last</span>
                    <input
                        class="input opt-days"
                        type="number"
                        min="1"
                        max="3650"
                        placeholder="–"
                        value={placedDays}
                        onchange={handlePlacedDays}
                        aria-label="Exclude anyone placed in the last N days"
                    />
                    <span>days</span>
                </label>
                <template lwc:if={isJobSearch}>
                    <label class="opt opt-toggle">
                        <input class="switch" type="checkbox" role="switch" checked={pipelineHidden} onchange={togglePipeline} />
                        <span>Hide candidates already on this job</span>
                    </label>
                </template>
            </div>
        </template>

        <template lwc:if={hasEditor}>
            <div class="editor" onkeydown={handleEditorKeydown} role="group" aria-label={editorTitle}>
                <div class="editor-head">
                    <div class="editor-title">{editorTitle}</div>
                    <button class="btn-icon sm" onclick={cancelEditor} aria-label="Close the editor"><c-cs-icon name="x" size="14"></c-cs-icon></button>
                </div>
                <div class="editor-grid">
                    <template lwc:if={isAdd}>
                        <label class="field ed-kind">
                            <span class="field-label">Type</span>
                            <select class="input" data-field="kind" onchange={handleEditor}>
                                <template for:each={kindOptions} for:item="k">
                                    <option key={k.value} value={k.value} selected={k.selected}>{k.label}</option>
                                </template>
                            </select>
                        </label>
                    </template>
                    <template lwc:if={showValue}>
                        <div class="field ed-value">
                            <span class="field-label">{valueLabel}</span>
                            <input class="input" type="text" data-field="value" value={editor.value} oninput={handleEditor} autocomplete="off" />
                            <template lwc:if={hasSuggestions}>
                                <ul class="suggest" role="listbox" aria-label="Skill suggestions">
                                    <template for:each={suggestions} for:item="s">
                                        <li key={s.id} role="option" aria-selected="false">
                                            <button class="suggest-item" data-id={s.id} data-label={s.label} onclick={pickSuggestion}>
                                                <span>{s.label}</span>
                                                <span class="suggest-cat">{s.category}</span>
                                            </button>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                        </div>
                    </template>
                    <template lwc:if={isLocation}>
                        <label class="field ed-num">
                            <span class="field-label">Radius (miles)</span>
                            <input class="input" type="number" data-field="radius" value={editor.radius} min="0" max="500" oninput={handleEditor} />
                        </label>
                    </template>
                    <template lwc:if={isAvailability}>
                        <label class="field ed-num">
                            <span class="field-label">Within (days)</span>
                            <input class="input" type="number" data-field="withinDays" value={editor.withinDays} min="1" max="365" oninput={handleEditor} />
                        </label>
                    </template>
                    <div class="field">
                        <span class="field-label">Weight</span>
                        <div class="seg" role="group" aria-label="Weight">
                            <template for:each={weightOptions} for:item="w">
                                <button key={w.value} class="seg-btn" data-value={w.value} aria-pressed={w.pressed} onclick={handleWeight}>{w.label}</button>
                            </template>
                        </div>
                    </div>
                </div>
                <template lwc:if={suggestError}><div class="ed-error" role="alert">Skill suggestions unavailable: {suggestError}</div></template>
                <template lwc:if={editorError}>
                    <div class="ed-error" role="alert"><c-cs-icon name="alert" size="14"></c-cs-icon>{editorError}</div>
                </template>
                <div class="editor-actions">
                    <button class="btn btn-ghost" onclick={cancelEditor}>Cancel</button>
                    <button class="btn btn-primary" data-action="save-editor" onclick={saveEditor}>{editorSaveLabel}</button>
                </div>
            </div>
        </template>
    </div>
</template>
