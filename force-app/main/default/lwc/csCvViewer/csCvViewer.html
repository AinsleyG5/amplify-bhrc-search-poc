<template>
    <div class="cv">
        <div class="cv-bar">
            <div class="cv-summary" aria-live="polite">{summary}</div>
            <div class="cv-actions">
                <button class="btn-icon sm" onclick={prev} disabled={navDisabled} aria-label={L.prevMatch} title={L.prevMatch}>
                    <c-cs-icon name="chevron-up" size="16"></c-cs-icon>
                </button>
                <button class="btn-icon sm" onclick={next} disabled={navDisabled} aria-label={L.nextMatch} title={L.nextMatch}>
                    <c-cs-icon name="chevron-down" size="16"></c-cs-icon>
                </button>
                <button class="btn btn-sm" data-action="open-original" onclick={openOriginal} disabled={openDisabled} title={L.openOriginalTitle}>
                    <template lwc:if={opening}><span class="spinner sm"></span></template>
                    <template lwc:else><c-cs-icon name="external" size="14"></c-cs-icon></template>
                    {L.openOriginal}
                </button>
            </div>
        </div>

        <template lwc:if={hasTerms}>
            <div class="terms" role="list" aria-label={L.termsInCv}>
                <template for:each={termChips} for:item="t">
                    <button key={t.key} role="listitem" class={t.cls} data-term={t.key} onclick={jumpToTerm} disabled={t.disabled}>
                        <span>{t.label}</span><span class="term-count">{t.count}</span>
                    </button>
                </template>
            </div>
        </template>

        <template lwc:if={openError}><div class="cv-error" role="alert">{openError}</div></template>

        <template lwc:if={loading}>
            <div class="shimmer cv-loading" aria-label={L.loadingCv}><span></span><span></span><span></span><span></span><span></span></div>
        </template>
        <template lwc:if={error}>
            <div class="cv-error" role="alert">
                {error}
                <button class="link" onclick={retry}>{L.retry}</button>
            </div>
        </template>
        <template lwc:if={hasDoc}>
            <article class="cv-doc" lwc:dom="manual"></article>
        </template>
    </div>
</template>
